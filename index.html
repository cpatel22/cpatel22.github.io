<html lang="en">
<head>

    <style>
       body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: auto;
            display: none;
        }
        #results {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
    
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KDKVJLSV"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
   <div id="reader"></div><br/><br/>
   <button id="start-scan">Start Scan</button>  <br/><br/> 
   <div><label id="msg"></label></div>
    <div id="results">
        <h3>Scanned Results:</h3>
        <ul id="result-list"></ul>
    </div>
    <script>document.addEventListener('DOMContentLoaded', () => {
    const startScanButton = document.getElementById('start-scan');
    const resultsList = document.getElementById('result-list');
    const readerDiv = document.getElementById('reader');
    const counters = {};

    let html5QrCode;

    function onScanSuccess(decodedText, decodedResult) {
        if (counters[decodedText]) {
            counters[decodedText]++;
        } else {
            counters[decodedText] = 1;
        }
        updateResults();
        
        recordResult(new Date().toLocaleString().replace(',',''),decodedText);
        html5QrCode.stop().then(() => {
            readerDiv.style.display = 'none';
        }).catch(err => console.error('Failed to stop QR code scanning:', err));
    }
function playBeep() {
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();

  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  oscillator.type = 'square';
  oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // Frequency in Hz
  gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Volume

  oscillator.start();
  oscillator.stop(audioCtx.currentTime + 0.2); // Play for 0.2 seconds
}
    function onScanFailure(error) {
        // Handle scan failure, if necessary
        console.warn(`Scan error: ${error}`);
    }

    function updateResults() {
        resultsList.innerHTML = '';
        for (const [code, count] of Object.entries(counters)) {
            const listItem = document.createElement('li');
            listItem.textContent = `${code}: ${count}`;
            resultsList.appendChild(listItem);
        }
    }
    async function recordResult(dates,barcode)
    {     

        const apiKey = 'patMTZiEQfTGNj2uk.0d889cfbb25371d50be22b0c0a7b5e5ef331c2572a93abe280759ed2520ef1fd';
        const baseId = 'app7nww4mzlPdBvTT';
        const tableName = 'enlighteningspeeches2025';
        
        const parts = barcode.split("_");
        const url = `https://api.airtable.com/v0/${baseId}/${tableName}`;
        const data = { "fields": {
        "DateTime": dates,
        "Email":parts[0].toString(), 
        "Phone":parts[1].toString(),
        "Name":parts[2].toString(),     
        "Adult_Male": parseInt(parts[3].toString()),  
        "Adult_Female": parseInt(parts[4].toString()),  
        "Kid_Male": parseInt(parts[5].toString()),  
        "Kid_Female": parseInt(parts[6].toString()),  
        "BarCode": barcode,  
      }};

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const jsonResponse =  response.json(); 
                document.getElementById('msg').innerHTML ="Jay Swaminarayan";              
                console.log(jsonResponse);
                playBeep(); // make the beep!
            } else {
                const errorResponse =  response.json(); 
                document.getElementById('msg').innerHTML = errorResponse.error.message;            
                console.error(errorResponse);
            }
        } catch (error) {
            document.getElementById('msg').innerHTML =error;
            console.error('Network error:', error);
        }
    }   

    startScanButton.addEventListener('click', () => {
        readerDiv.style.display = 'block';
        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: 250 };       
        html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanFailure
        ).catch(err => {
            console.error(`Unable to start scanning, error: ${err}`);
        });
    });
});
    </script>
</body>
</html>
